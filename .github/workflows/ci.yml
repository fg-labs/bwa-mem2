name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Least-privilege GITHUB_TOKEN. Without this block the token inherits the
# repository default, which -- depending on the org/repo setting -- can be
# read/write across contents, issues, pull requests and more, far beyond what
# any job here needs. Nothing in this workflow uses the token except
# actions/checkout, so `contents: read` is the whole requirement:
#
#   - actions/upload-artifact and actions/cache authenticate with
#     ACTIONS_RUNTIME_TOKEN, which the runner injects independently of
#     `permissions:` -- they need no grant here.
#   - codecov-action uploads tokenless (no `token:`/`use_oidc:` below), so it
#     needs neither `id-token: write` nor a secret.
#
# release.yml is the counterexample worth keeping in view: it starts from
# `permissions: {}` and grants `contents`/`pull-requests` write per job,
# because its jobs genuinely differ. Here all three jobs need exactly
# `contents: read`, so it is declared once at the workflow level.
permissions:
  contents: read

jobs:
  # Source-only lint; no toolchain, no build. Kept as its own job so the
  # failure reads as "you wrote an NDEBUG gate" rather than being buried in a
  # matrix row, and so it reports in seconds instead of after a full build.
  ndebug-gate-lint:
    name: NDEBUG gate lint (src/)
    runs-on: ubuntu-latest
    # Source-only lint that reports in seconds; a generous ceiling so only a
    # genuinely hung runner trips it, never a slow-but-normal one.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Runs first: the lint's PASS is indistinguishable from the PASS a lint
      # whose matcher has stopped matching prints, so the step below only means
      # something once the matcher has been shown to still reject real gates.
      - name: NDEBUG gate lint still detects gates
        run: bash test/regression/ndebug_gate_lint_selftest.sh

      - name: No NDEBUG preprocessor gates in src/
        run: bash test/regression/ndebug_gate_lint.sh

  # Same shape and rationale as the job above, kept separate so the failure
  # reads as "the opt-in macro list drifted" rather than as an NDEBUG finding.
  debug-macro-flag-lint:
    name: Opt-in debug macro list (ci.yml <-> src/)
    runs-on: ubuntu-latest
    # Source-only lint, seconds of work; ceiling catches a hung runner only.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Runs first, for the same reason as the NDEBUG job: an empty flag set
      # satisfies every check over it, so PASS only means something once the
      # extraction has been shown to still detect a drifted list.
      - name: Macro list lint still detects drift
        run: bash test/regression/debug_macro_flag_lint_selftest.sh

      - name: Opt-in macro -D list matches the macros in src/
        run: bash test/regression/debug_macro_flag_lint.sh

  # Same shape and rationale as the two jobs above: source-only, no toolchain,
  # its own job so the failure reads as "your shell script is unformatted"
  # rather than being buried in a matrix row. Runs in seconds.
  shell-lint:
    name: Shell lint (shellcheck + shfmt)
    runs-on: ubuntu-latest
    # Downloads two small pinned tools then lints; well under a minute normally.
    timeout-minutes: 10
    env:
      # Pinned, and kept in lockstep with the constants at the top of
      # test/regression/shell_lint.sh. ubuntu-latest ships a shellcheck of its
      # own at a floating version; an upgrade there that adds a check would
      # otherwise turn this job red on a pull request that never touched
      # shell. The gate gets stricter only when someone bumps these.
      SHELLCHECK_VERSION: "0.11.0"
      SHFMT_VERSION: "v3.13.1"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      SHFMT_SHA256: "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1"
      # Turns a missing tool into a hard error instead of the SKIP that keeps
      # `make test` working on a developer box. Without it a broken install
      # step below would leave this job permanently, silently green.
      SHELL_LINT_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Checksum-verified for the same reason the actions above are pinned by
      # commit hash rather than tag: a release asset can be replaced in place.
      - name: Install pinned shellcheck and shfmt
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/shellcheck"

          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          install -m 0755 /tmp/shfmt "$HOME/.local/bin/shfmt"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report tool versions
        run: |
          shellcheck --version
          shfmt --version

      # Runs first, for the same reason as the two lint jobs above: this gate's
      # PASS is indistinguishable from the PASS it would print if it had
      # stopped checking anything, so the step below only means something once
      # the gate has been shown to still reject bad scripts.
      - name: Shell lint still detects bad scripts
        run: bash test/regression/shell_lint_selftest.sh

      - name: Tracked shell scripts are shellcheck-clean and shfmt-formatted
        run: bash test/regression/shell_lint.sh

  # Fourth source-only lint, same shape as the three above. Kept separate so the
  # failure reads as "a regression script runs nowhere" on its own line.
  regression-coverage-lint:
    name: Regression scripts are run by CI
    runs-on: ubuntu-latest
    # Source-only lint, seconds of work; ceiling catches a hung runner only.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Coverage lint still detects an unrun script
        run: bash test/regression/regression_coverage_lint_selftest.sh

      - name: Every regression script is run by CI
        run: bash test/regression/regression_coverage_lint.sh

  # Same shape again. Separate so the failure reads as "the regression README
  # went stale" rather than as a finding about src/.
  readme-contract-lint:
    name: Regression README contract (README <-> test/regression/)
    runs-on: ubuntu-latest
    # Source-only lint, seconds of work; ceiling catches a hung runner only.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Runs first, for the same reason as the three jobs above: deciding which
      # scripts read no environment is a heuristic over shell text, and a
      # heuristic that has stopped matching reports a clean README.
      - name: README lint still detects drift
        run: bash test/regression/readme_contract_lint_selftest.sh

      - name: README still describes the regression scripts
        run: bash test/regression/readme_contract_lint.sh

  build-and-test:
    strategy:
      fail-fast: false
      # Each row carries `artifact_slug` (a-z0-9-) alongside the human-
      # friendly `name`. Artifact uploads use the slug to keep names URL-
      # safe and free of spaces / parens; job titles still use `name`.
      matrix:
        include:
          - os: ubuntu-latest
            arch_flag: "sse41"
            use_mimalloc: "1"
            run_integration: true
            name: "Linux x86_64 SSE4.1 (mimalloc)"
            artifact_slug: "linux-x86_64-sse41-mimalloc"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "1"
            canonical: true
            run_integration: true
            name: "Linux x86_64 AVX2 (mimalloc)"
            artifact_slug: "linux-x86_64-avx2-mimalloc"
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "0"
            name: "Linux x86_64 AVX2 (no-mimalloc)"
            artifact_slug: "linux-x86_64-avx2-no-mimalloc"
          - os: ubuntu-24.04-arm
            arch_flag: ""
            use_mimalloc: "1"
            run_integration: true
            name: "Linux ARM64 (mimalloc)"
            artifact_slug: "linux-arm64-mimalloc"
          - os: macos-latest
            arch_flag: ""
            use_mimalloc: "1"
            run_integration: true
            # macOS uses Apple clang (its `g++`/`clang++` are Apple clang), which
            # is above the Apple-clang floor — no llvm.sh install needed here.
            cxx: "clang++"
            cc: "clang"
            name: "macOS ARM64 (mimalloc)"
            artifact_slug: "macos-arm64-mimalloc"
          - os: ubuntu-latest
            arch_flag: ""
            use_mimalloc: "1"
            run_integration: true
            name: "Linux x86_64 single-binary (mimalloc)"
            artifact_slug: "linux-x86_64-single-mimalloc"
          # Same single-binary build as the row above, but with the
          # BASELINE_ARCH override flipped to sse41 (the vintage-host
          # portability path). PR #83 originally hardcoded the sse41
          # baseline; the perf-regression fix flipped the default to avx2
          # and made it tunable. Keep this row so the override path stays
          # exercised — without it, a future refactor could silently drop
          # sub-avx2 portability.
          - os: ubuntu-latest
            arch_flag: ""
            baseline_arch: "sse41"
            use_mimalloc: "1"
            run_integration: true
            name: "Linux x86_64 single-binary BASELINE_ARCH=sse41 (mimalloc)"
            artifact_slug: "linux-x86_64-single-sse41-baseline-mimalloc"
          # gcc build-compatibility lane. The rest of the matrix builds with
          # clang-19 (the shipping/benchmarked compiler); this one row keeps the
          # g++ build exercised. g++ on ubuntu-latest is below the compiler floor,
          # so it opts out with ALLOW_UNSUPPORTED_COMPILER=1 — deliberate here.
          - os: ubuntu-latest
            arch_flag: "avx2"
            use_mimalloc: "1"
            run_integration: true
            cxx: "g++"
            cc: "gcc"
            allow_unsupported: "1"
            name: "Linux x86_64 AVX2 (gcc compat)"
            artifact_slug: "linux-x86_64-avx2-gcc-compat"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Heaviest job here: the canonical row does several full `make clean`
    # rebuilds (debug-macro build, SIMD-floor build, ASAN build) on top of the
    # mimalloc build plus reference download/index. Normal rows finish in a few
    # minutes; the canonical row runs longest. Sized well above that so a hung
    # runner fails fast instead of at the 6h default, without flaking a slow row.
    timeout-minutes: 45

    # Compiler is set per row: CXX defaults to clang-19 (installed from
    # apt.llvm.org below), overridden to g++ on the gcc-compat row. CC and the
    # compiler-floor opt-out are provided here at the job level so every `make`
    # invocation in the job (main build, test binaries, ASAN, integration)
    # inherits them without repeating the flags on each command line. The gcc
    # row is below the floor by design, so it sets allow_unsupported: "1".
    env:
      # CXX and CC at the job level so EVERY make invocation inherits them,
      # including nested sub-makes (e.g. the integration step's `make -C ..` to
      # build the reference binary) that don't pass the compiler explicitly.
      # Command-line CXX=/CC= on individual steps still override these.
      CXX: ${{ matrix.cxx || 'clang++-19' }}
      CC: ${{ matrix.cc || 'clang-19' }}
      ALLOW_UNSUPPORTED_COMPILER: ${{ matrix.allow_unsupported || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Do not leave the GITHUB_TOKEN in .git/config after checkout. The
          # steps that follow run the repository's own build scripts and the
          # vendored submodules' configure/make, none of which does any git
          # operation needing auth -- so a persisted credential is reachable
          # by that code for no benefit. `submodules: recursive` is unaffected;
          # checkout authenticates the submodule fetch inline. profiling-build
          # below already set this; all four checkouts now agree.
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # libomp-dev is required so `clang++ -fopenmp` can find -lomp when
        # building the test framework on the AVX2 clang matrix row. On g++
        # rows it's unused — libgomp ships with g++.
        #
        # libdeflate-dev exercises the htslib_static.mk transitive-deps
        # path: htslib's configure auto-detects libdeflate and libhts.a
        # then references libdeflate_* symbols that resolve via -ldeflate
        # from $(HTSLIB_static_LIBS). Without this on the runner, the
        # libdeflate-enabled link path is invisible to CI.
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev bwa autoconf automake samtools libomp-dev
          version: 1.1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install bwa autoconf automake libomp libdeflate

      - name: Install clang-19 (Linux)
        # The matrix builds with clang-19 by default — the shipping/benchmarked
        # compiler and the compiler-floor minimum (see the Makefile's compiler
        # version floor). Installed from apt.llvm.org via a pinned repo rather
        # than piping llvm.sh into `sudo bash`: fetch LLVM's archive signing key,
        # VERIFY its fingerprint against LLVM's published value before trusting
        # it, store it in a dedicated keyring, and add the repo `signed-by` that
        # keyring so a tampered mirror or a changed installer script can't run
        # code as root or slip in unsigned packages. Skipped on the gcc-compat
        # lane, which deliberately builds with the runner's g++ +
        # ALLOW_UNSUPPORTED_COMPILER=1.
        if: runner.os == 'Linux' && matrix.cxx != 'g++'
        run: |
          set -euo pipefail
          . /etc/os-release
          codename="${VERSION_CODENAME:-$(lsb_release -cs)}"
          # LLVM's published apt archive signing key fingerprint.
          expected_fpr="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          got_fpr="$(gpg --show-keys --with-colons --with-fingerprint /tmp/llvm-snapshot.gpg.key \
            | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ "$got_fpr" != "$expected_fpr" ]; then
            echo "FATAL: LLVM archive key fingerprint mismatch: got '$got_fpr', expected '$expected_fpr'" >&2
            exit 1
          fi
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          # libomp-19-dev provides omp.h in clang-19's search path (libsais.c
          # uses -fopenmp); ubuntu's libomp-dev matches the distro clang, not 19.
          sudo apt-get install -y clang-19 libomp-19-dev
          clang++-19 --version | head -1

      - name: Verify CMake is available
        run: cmake --version

      - name: Build bwa-mem3
        # For arch_flag="" rows the build goes through the single: target,
        # which honors BASELINE_ARCH (defaults to avx2; override per-row via
        # matrix.baseline_arch). On ARM rows BASELINE_ARCH is harmless — the
        # single: recipe short-circuits to the arm64 build before consulting
        # it. On rows that pin arch=… we hit a single-arch build that bypasses
        # single: entirely, so BASELINE_ARCH is not used and is omitted.
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" \
              BASELINE_ARCH=${{ matrix.baseline_arch || 'avx2' }} \
              CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          else
            make -j"$(nproc)" \
              arch=${{ matrix.arch_flag }} \
              CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          fi

      - name: Verify binary
        run: ./bwa-mem3 version

      # `./bwa-mem3 version` above only proves the binary runs. The regression
      # script asserts what the banner actually says -- the SIMD floor and
      # runtime tier lines, and that BWAMEM3_FORCE_TIER downgrades the runtime
      # line. It was wired only into `make test`, which no workflow invokes, so
      # until now it ran nowhere in CI. Every row rather than the canonical one:
      # the lines it checks are exactly what differs across arch and floor.
      #
      # EXPECTED_FLOOR makes the floor line an assertion rather than a presence
      # check -- without it the row only proves the banner has a floor, not that
      # it names the tier this row was built for. The script skips the
      # comparison when EXPECTED_FLOOR is empty, so the arch_flag="" rows (ARM,
      # macOS, single-binary) still run the rest of the checks.
      - name: Version banner regression
        run: BWA_MEM3=./bwa-mem3 EXPECTED_FLOOR=${{ matrix.arch_flag }} bash test/regression/version_banner.sh

      - name: Build doctest framework and unit binary
        # Invoke via the parent `test-binaries` target so ARCH_FLAGS
        # propagate from libbwa.a's build into the test CXXFLAGS. Ensures
        # BWA_TESTS_HAVE_KSWV in kswv_runner.h evaluates consistently
        # between libbwa.a and the test binary (notably: sse41 row has
        # no kswv::getScores8 symbol, so tests must be compiled out).
        # For arch_flag="" rows (ARM, macOS, single-binary x86), the parent
        # build auto-selects ARCH_FLAGS via IS_ARM (ARM) or falls back to
        # the file-default -msse4.1 floor (x86 single-binary, which compiled
        # all tier kernels separately; the test TU compiles at sse41 here
        # regardless of BASELINE_ARCH, so kswv tests gate on BWA_TESTS_HAVE_KSWV
        # and skip when the test TU lacks __AVX2__/__AVX512BW__).
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make test-binaries CXX=${{ matrix.cxx || 'clang++-19' }}
          else
            make test-binaries arch=${{ matrix.arch_flag }} CXX=${{ matrix.cxx || 'clang++-19' }}
          fi

      - name: Run unit tests (all rows)
        env:
          BWA_MEM3_TEST_MATRIX_ROW: ${{ matrix.name }}
        # `--reporters=junit --out=…` writes JUnit XML to the file and
        # nothing to stdout. doctest itself prints the failing-assertion
        # summary to stderr before exiting non-zero, so the per-step log
        # already surfaces the diagnosis; the JUnit XML is only consumed
        # via the upload-artifact step below.
        run: |
          ./test/bwa_mem3_tests_unit \
            --reporters=junit \
            --out=unit-results-${{ strategy.job-index }}.xml

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Sanitize matrix.name (contains spaces and parens like
          # "Linux x86_64 SSE4.1 (mimalloc)") into a hyphenated artifact
          # name. upload-artifact@v7 technically allows spaces and parens
          # but a sanitized name keeps URLs and downloads clean.
          name: unit-results-${{ matrix.artifact_slug }}
          path: unit-results-*.xml

      - name: Zero-sequence index loads when calloc(0) returns NULL
        # A standalone binary, not a doctest case: it interposes calloc so a
        # zero-size request returns NULL, which is the only way to tell a
        # correct allocation guard from an unconditional one -- glibc and macOS
        # libmalloc both hand back non-NULL there, so on the real allocator the
        # buggy and fixed code are indistinguishable. Interposing inside the
        # doctest binary would redirect every other test case's allocations
        # through it, hence the separate executable. Run on every row so the
        # interposition itself is exercised on each toolchain; the test fails
        # loudly rather than silently passing if it is not in effect.
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make bns_zero_calloc_test arch=${{ matrix.baseline_arch || 'avx2' }} \
              CXX=${{ matrix.cxx || 'clang++-19' }}
          else
            make bns_zero_calloc_test arch=${{ matrix.arch_flag }} CXX=${{ matrix.cxx || 'clang++-19' }}
          fi
          ./bns_zero_calloc_test

      - name: Alloc-guard regression tests (overflow / negative-size / OOM)
        # Standalone binaries pinning the allocation and size-arithmetic guard
        # paths, which no workflow ran until now (they were reachable only
        # from `make test`, which no workflow invokes). Each forks a child
        # that must abort with a specific diagnostic; the parent verifies:
        #   - read_arena_overflow_test: read_arena_dup(len=SIZE_MAX) must
        #     abort with "read field length overflows size_t".
        #   - packed_text_neg_nbases_test: PackedText(n_bases=-1) must abort
        #     with "negative n_bases".
        #   - packed_text_overflow_nbases_test: PackedText(n_bases=INT64_MAX)
        #     must abort with "too large", not the generic "too small"
        #     message an unguarded (n_bases + 3) >> 2 overflow happens to
        #     produce.
        #   - mem_gen_alt_zero_calloc_test: mem_gen_alt with a->n==0 must
        #     return cleanly even when calloc(0) returns NULL.
        # All four link libbwa.a, so they need the same arch/CXX propagation
        # as bns_zero_calloc_test above, plus USE_MIMALLOC: the build-flags
        # stamp keys on CPPFLAGS (which carries -DUSE_MIMALLOC=1), so omitting
        # it lets the default USE_MIMALLOC=1 rebuild libbwa.a with mimalloc on
        # the use_mimalloc="0" row -- the row would then never exercise the
        # no-mimalloc build. Carry the row's setting so it does.
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            make read_arena_overflow_test packed_text_neg_nbases_test \
              packed_text_overflow_nbases_test mem_gen_alt_zero_calloc_test \
              arch=${{ matrix.baseline_arch || 'avx2' }} \
              CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          else
            make read_arena_overflow_test packed_text_neg_nbases_test \
              packed_text_overflow_nbases_test mem_gen_alt_zero_calloc_test \
              arch=${{ matrix.arch_flag }} CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}
          fi
          ./read_arena_overflow_test
          ./packed_text_neg_nbases_test
          ./packed_text_overflow_nbases_test
          ./mem_gen_alt_zero_calloc_test

      - name: Fast-reader batch reader safety and coverage
        # Standalone tests for the bseq_read_fast adapter, which no workflow ran
        # until now (they were reachable only from `make test`). Two checks:
        #   - bseq_read_pe_oob_test (ASan): the paired-end odd-capacity
        #     out-of-bounds regression -- a paired iteration writes two records
        #     but capacity was checked once, so an odd initial estimate overran
        #     the buffer by one. Built with ASan so any regression aborts.
        #   - bseq_read_comment_copy_test: the copy_comment/-C gate (comment
        #     copied through only when requested AND present), across SE/PE.
        # Reader TUs only (no libbwa link), so no arch/CXX propagation is needed;
        # run on every row for toolchain coverage.
        run: |
          make bseq_read_pe_oob_test bseq_read_comment_copy_test
          ./bseq_read_pe_oob_test
          ./bseq_read_comment_copy_test
      - name: kvec growth aborts on realloc failure
        # Header-only standalone binary, forked like a death test: it forces the
        # realloc behind kvec.h's growth macros to fail and asserts the child
        # aborts with an out-of-memory diagnostic (SIGABRT) rather than leaking
        # the old buffer and writing through the NULL realloc returns. On the
        # real allocator realloc effectively never hands back NULL (overcommit +
        # the OOM killer), so only a forced failure distinguishes the guarded
        # path from the unguarded one. Arch-independent (pure C control flow, no
        # SIMD), so it needs no arch_flag row-branching; CC comes from the
        # job-level env.
        run: |
          make kvec_alloc_fail_test
          ./kvec_alloc_fail_test

      - name: Run integration tests
        if: matrix.run_integration == true
        env:
          BWA_MEM3_TEST_MATRIX_ROW: ${{ matrix.name }}
        run: |
          ./test/bwa_mem3_tests_integration \
            --reporters=junit \
            --out=integration-results-${{ strategy.job-index }}.xml

      - name: Upload integration-test results
        if: always() && matrix.run_integration == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-results-${{ matrix.artifact_slug }}
          path: integration-results-*.xml

      - name: Verify mimalloc is linked (when enabled)
        if: matrix.use_mimalloc == '1'
        run: test/mimalloc_loaded_test.sh ./bwa-mem3

      - name: Verify mimalloc is NOT linked (when disabled)
        if: matrix.use_mimalloc == '0'
        run: |
          if test/mimalloc_loaded_test.sh ./bwa-mem3; then
            echo "FAIL: USE_MIMALLOC=0 build should NOT report mimalloc" >&2
            exit 1
          fi
          echo "PASS: no-mimalloc build correctly omits mimalloc"

      - name: Cache chr22 reference
        id: cache-chr22
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/chr22/chr22.fa
          key: chr22-hg38-ucsc-v1

      - name: Download chr22 reference (hg38)
        if: steps.cache-chr22.outputs.cache-hit != 'true'
        # --fail makes curl exit non-zero on HTTP 4xx/5xx instead of writing
        # the error body into the gunzip pipe; --retry/--retry-delay/
        # --retry-all-errors absorb transient UCSC hiccups so a flaky 5xx
        # doesn't fail the whole matrix on a cold cache. The SHA-256 pin
        # is enforced unconditionally by the next step so it catches both
        # a fresh download and a restored cache entry.
        run: |
          mkdir -p /tmp/chr22
          curl --fail --retry 3 --retry-delay 2 --retry-all-errors -sSL \
            "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr22.fa.gz" \
            | gunzip > /tmp/chr22/chr22.fa
          test -s /tmp/chr22/chr22.fa
          echo "chr22.fa bytes: $(wc -c < /tmp/chr22/chr22.fa)"

      - name: Verify chr22 reference SHA-256
        # Runs unconditionally — after a cache restore (hit) and after a
        # fresh download (miss) — so the parity input is always
        # cryptographically validated against the pin. Without this, a
        # stale chr22-hg38-ucsc-v1 cache entry (e.g., one populated
        # before the pin existed, or one carried over from a future pin
        # bump that forgot to rev the cache key) would silently swap
        # every regression job to a different chr22 payload.
        env:
          CHR22_FASTA_SHA256_PIN: ce3ee1ca39356238f7aee438a40a88b4f1b9d80b316b263e16fb12402212d10f
        run: |
          actual_sha=$(shasum -a 256 /tmp/chr22/chr22.fa | awk '{print $1}')
          if [ "$actual_sha" != "$CHR22_FASTA_SHA256_PIN" ]; then
            echo "FAIL: chr22.fa sha256 mismatch (expected $CHR22_FASTA_SHA256_PIN, got $actual_sha)" >&2
            exit 1
          fi

      - name: Build chr22 FMI index
        # bwa-mem3 index is rebuilt every run because its sidecar layout is
        # coupled to the bwa-mem3 binary, which changes per commit.
        run: |
          cd /tmp/chr22
          "$GITHUB_WORKSPACE/bwa-mem3" index chr22.fa
          ls chr22.fa.*

      - name: Compute chr22 bwa-index cache inputs
        # Salt the bwa-index cache key with the inputs that actually
        # produce it: the bwa version (apt on Linux, brew on macOS) and a
        # digest of chr22.fa. Without this, an apt/brew bwa bump or a
        # UCSC reference refresh would silently restore stale sidecars
        # built from different inputs, breaking parity. shasum -a 256 is
        # available on both ubuntu-latest and macos-latest.
        run: |
          bwa_version=$(bwa 2>&1 | sed -n 's/^Version: //p' | head -1)
          chr22_fasta_sha=$(shasum -a 256 /tmp/chr22/chr22.fa | awk '{print $1}' | cut -c1-16)
          {
            echo "BWA_VERSION=${bwa_version}"
            echo "CHR22_FASTA_SHA=${chr22_fasta_sha}"
          } >> "$GITHUB_ENV"
          echo "BWA_VERSION=${bwa_version}"
          echo "CHR22_FASTA_SHA=${chr22_fasta_sha}"

      - name: Cache chr22 bwa indexes
        # Sidecars are cached separately from the chr22 FASTA so an
        # apt/brew bwa bump invalidates this key without re-downloading
        # the reference. The key is salted by ${BWA_VERSION} and a
        # ${CHR22_FASTA_SHA} digest of chr22.fa (exported above) plus
        # ${runner.os} to differentiate apt vs. brew bwa builds.
        id: cache-chr22-bwa
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/chr22/bwa_chr22.fa
            /tmp/chr22/bwa_chr22.fa.amb
            /tmp/chr22/bwa_chr22.fa.ann
            /tmp/chr22/bwa_chr22.fa.bwt
            /tmp/chr22/bwa_chr22.fa.pac
            /tmp/chr22/bwa_chr22.fa.sa
          key: chr22-hg38-ucsc-bwa-v2-${{ runner.os }}-${{ env.BWA_VERSION }}-${{ env.CHR22_FASTA_SHA }}

      - name: Build chr22 bwa indexes
        if: steps.cache-chr22-bwa.outputs.cache-hit != 'true'
        # bwa index writes sidecars next to the FASTA filename, so we use
        # a dedicated bwa_chr22.fa copy to keep its sidecars from
        # colliding with the bwa-mem3 index files at /tmp/chr22/chr22.fa.*.
        run: |
          cp /tmp/chr22/chr22.fa /tmp/chr22/bwa_chr22.fa
          bwa index /tmp/chr22/bwa_chr22.fa
          ls /tmp/chr22/bwa_chr22.fa.*

      - name: Setup holodeck (pixi)
        # Install holodeck via bioconda; pinned to v0.2.1 in
        # test/holodeck/pixi.toml. Runs on every matrix row. samtools is
        # bundled with holodeck in this pixi env so we have a uniform
        # source of `samtools faidx` across linux-64, linux-aarch64, and
        # osx-arm64 (the macOS brew step otherwise wouldn't carry it).
        uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.49.0
          manifest-path: test/holodeck/pixi.toml
          cache: true

      - name: Index chr22 with samtools faidx
        # holodeck requires an indexed FASTA (.fai sidecar). The
        # bwa-mem3 indexer doesn't produce .fai, so build it here.
        # --frozen makes pixi error if pixi.lock is out of sync with
        # pixi.toml rather than silently regenerating the lockfile;
        # that pins samtools (manifest unbounded at >=1.20) and every
        # transitive dep to the committed lockfile for deterministic CI.
        run: |
          pixi run --frozen --manifest-path test/holodeck/pixi.toml -- \
            samtools faidx /tmp/chr22/chr22.fa

      - name: Simulate chr22 reads with holodeck
        # Deterministic ~50k PE pairs by construction: chr22 is ~50 Mbp
        # and --coverage 0.3 with --read-length 150 (~300 bp inserts)
        # yields ~50k pairs. --simple-names emits @holodeck::N headers
        # (aligners ignore name content). Flat 0.001 error rate mimics
        # dwgsim's -r 0.001 -S 2 to keep the byte-identical parity bar
        # realistic.
        run: |
          mkdir -p /tmp/chr22-sim
          pixi run --frozen --manifest-path test/holodeck/pixi.toml -- \
            holodeck simulate \
              -r /tmp/chr22/chr22.fa \
              -o /tmp/chr22-sim/reads \
              --coverage 0.3 \
              --read-length 150 \
              --seed 42 \
              --simple-names \
              --min-error-rate 0.001 --max-error-rate 0.001
          ls /tmp/chr22-sim/

      - name: Compare chr22 bwa vs bwa-mem3 (parity)
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          BWA_CHR22_FA=/tmp/chr22/bwa_chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/chr22_parity.sh

      - name: Long-read PE 8-bit/16-bit parity (chr22, 400bp)
        if: matrix.canonical == true
        # Exercises the recovered >=128bp 8-bit banded-SW path end-to-end: the
        # script self-simulates 400bp PE reads and diffs `bwa-mem3 mem` with the
        # 8-bit path enabled (default) vs BWAMEM3_DISABLE_BSW8=1 (forced 16-bit).
        # The two must be byte-identical -- guards the unsigned [0,255] recurrence
        # + routing gate against regression. Self-contained A/B (one binary).
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim-longread \
          PIXI_MANIFEST="$GITHUB_WORKSPACE/test/holodeck/pixi.toml" \
          bash test/regression/longread_pe_parity.sh

      - name: SIMD tier parity (avx2 vs avx512bw, chr22)
        if: matrix.canonical == true
        # One binary must emit byte-identical SAM whichever usable kernel tier it
        # dispatches. Scope is avx2/avx512bw: there is no batched kswv kernel
        # below AVX2 and forcing those tiers aborts the aligner (see the script
        # header). Cross-build parity is a different property, already covered by
        # chr22_parity.sh running on the sse41, avx2 and arm64 build jobs.
        #
        # On a runner without AVX-512BW there is only one sweepable tier and the
        # script reports SKIP:, not PASS: — so this step is a no-op there rather
        # than a false green. It still earns its place: the script had rotted
        # unrun to the point of aborting on its first tier, and this keeps that
        # from recurring silently.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          PARITY_FA=/tmp/chr22/chr22.fa \
          PARITY_R1=/tmp/chr22-sim/reads.r1.fastq.gz \
          PARITY_R2=/tmp/chr22-sim/reads.r2.fastq.gz \
          bash test/regression/all_tiers_parity.sh

      - name: Run unit-test harness
        if: matrix.canonical == true || matrix.arch_flag == 'sse41'
        run: |
          bash test/run_unit_tests.sh

      - name: Makefile header-dependency check
        # Runs after the build because it inspects an already-built tree; on an
        # unbuilt one it would drag in the htslib configure first.
        #
        # MAKE_ARGS must carry the same flags this row built with, matching the
        # `Build bwa-mem3` step above: the wiring probe recompiles one object, and
        # recompiling it at different flags than libbwa.a was built with is the
        # hazard this check exists to catch. The empty-arch_flag branch is
        # unreachable while `canonical` sits on an avx2 row — it is kept so the
        # step keeps working if canonical ever moves to an ARM or single-binary
        # row, where an empty `arch=` would select a different build path.
        if: matrix.canonical == true
        run: |
          if [ "${{ matrix.arch_flag }}" = "" ]; then
            MAKE_ARGS="BASELINE_ARCH=${{ matrix.baseline_arch || 'avx2' }} CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}" \
              bash test/regression/make_header_deps.sh
          else
            MAKE_ARGS="arch=${{ matrix.arch_flag }} CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}" \
              bash test/regression/make_header_deps.sh
          fi

      - name: Makefile default-goal check
        # Also post-build, for the same reason as the step above. No arch= here:
        # the script sets it per case, since the goal is what it is checking.
        if: matrix.canonical == true
        run: |
          MAKE_ARGS="CXX=${{ matrix.cxx || 'clang++-19' }} USE_MIMALLOC=${{ matrix.use_mimalloc }}" \
            bash test/regression/make_default_goal.sh

      - name: Makefile compiler floor exempts clean goals
        # Parse-time behaviour, so it needs no built tree, but the canonical row
        # is where the other Makefile-behaviour checks live. Self-contained: the
        # script stubs a below-floor compiler and drives `make -n`, so it takes
        # no MAKE_ARGS and compiles nothing.
        if: matrix.canonical == true
        run: bash test/regression/make_clean_no_compiler_floor.sh

      - name: --bam=6 roundtrip smoke (chr22)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/bam_roundtrip.sh

      - name: --bam-threads byte-identity (chr22, serial vs threaded BGZF)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/bam_threads_byte_identity.sh

      - name: Thread-determinism smoke (chr22, -t 1 vs -t 4)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/thread_determinism.sh

      - name: Chaining scratch is per-thread, not per-read
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          bash test/regression/chain_scratch_per_thread.sh

      - name: Cohort slicing does not change output
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/cohort_slice_identity.sh

      - name: Cohort ramp values are validated (flag and environment alike)
        if: matrix.canonical == true
        # --cohort-ramp-first takes plain bases, and atoll("16M") is 16 -- a
        # positive value, so an unvalidated parse configures a 16-BYTE first
        # slice for a user who asked for 16 Mbases, silently. The flag must
        # refuse it and the env spelling must report and ignore it.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/cohort_ramp_validation.sh

      - name: Chunk cap stays opt-in (batching matches bwa-mem2 at every -t)
        if: matrix.canonical == true
        # bwa and bwa-mem2 both use an uncapped `chunk_size * n_threads` batch.
        # A default cap re-partitions the input, which changes each batch's
        # mem_pestat cohort and therefore the output, for every -t >= 26.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/chunk_cap_optin.sh

      - name: --rescue-kmer/--rescue-band reject malformed values
        if: matrix.canonical == true
        # Both were parsed with atoi(), which maps unparseable text to 0. For
        # --rescue-kmer 0 means "off" and counts as explicitly set, so a typo
        # would silently disable the largest lever in --fast; for --rescue-band
        # the kernel's `band > 0 ? band : 50` guard turned a bad value back into
        # the default. Neither is visible in the output.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/rescue_kmer_options.sh

      - name: -t rejects malformed values and clamps out-of-range values
        if: matrix.canonical == true
        # -t was parsed with atoi(), which maps unparseable text to 0 and
        # ignores trailing garbage, so a typo read as a valid-looking thread
        # count with no diagnostic. Separately, a value above MAX_THREADS must
        # be clamped (with a warning), not rejected -- it is oversized, not
        # malformed.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/thread_count_validation.sh

      # Its own step rather than appended to the one above, matching every other
      # regression check in this job: bundled, a failure in the first script
      # leaves the second unrun and the step name cannot say which one failed.
      - name: --rescue-skip requires --rescue-kmer and composes with --fast
        if: matrix.canonical == true
        # --rescue-skip keys on the --rescue-kmer anchor scan, so with the scan
        # off it would be silently inert -- a flag that changes which reads get
        # rescued going quietly nowhere. It must hard-error instead, in either
        # flag order, while still accepting `--fast --rescue-kmer=0` (a
        # supported opt-out) and `--fast --rescue-skip` (opt-in, audit-named).
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/rescue_skip_options.sh

      - name: --supp-rep-hard-cap repetitive-seed regression
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          SUPP_REP_FIXTURE_AWK="$GITHUB_WORKSPACE/test/fixtures/supp_rep/build_fixture.awk" \
          SUPP_REP_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          bash test/regression/supp_rep_hard_cap.sh

      - name: --compat byte-identical regression (phix)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          COMPAT_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          COMPAT_WORK_DIR=/tmp/compat-bytes \
          bash test/regression/compat_byte_identical.sh

      - name: byte-identity off==on==auto (extension-DP job dedup)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          DEDUP_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          DEDUP_WORK_DIR=/tmp/dedup-bytes \
          bash test/regression/dedup_byte_identity.sh

      - name: byte-identity off==on==auto (whole-read-pair memoization)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          DEDUP_READS_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          DEDUP_READS_WORK_DIR=/tmp/dedup-reads-bytes \
          bash test/regression/dedup_reads_byte_identity.sh

      - name: --hic alias regression (byte-identical to -5SP)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HIC_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          HIC_WORK_DIR=/tmp/hic-alias \
          bash test/regression/hic_alias_identical.sh

      - name: band_cert byte-identical regression (--no-band-cert A/B, phix)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          BAND_CERT_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          BAND_CERT_WORK_DIR=/tmp/band-cert-bytes \
          bash test/regression/band_cert_identity.sh

      - name: chain-flt empty-array compat regression (#310)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHAIN_FLT_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          CHAIN_FLT_WORK_DIR=/tmp/chain-flt-empty \
          bash test/regression/chain_flt_empty_compat.sh

      - name: header parity regression (AH:*, --compat @HD/@SQ)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HEADER_PARITY_WORK_DIR=/tmp/header-parity \
          bash test/regression/header_parity.sh

      - name: proper-pair ALT derivation regression (--proper-pair-from-emitted)
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          PROPER_PAIR_ALT_WORK_DIR=/tmp/proper-pair-alt \
          bash test/regression/proper_pair_alt.sh

      - name: default @HD parity across output paths
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HD_PARITY_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          HD_PARITY_WORK_DIR=/tmp/hd-parity \
          bash test/regression/default_hd_parity.sh

      - name: "pa:f: SAM vs --bam parity (ALT-aware fixture)"
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          ALT_PA_WORK_DIR=/tmp/alt-pa-parity \
          bash test/regression/alt_pa_parity.sh

      - name: "pa:f: --meth parity (ALT-aware bisulfite fixture)"
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          METH_ALT_PA_WORK_DIR=/tmp/meth-alt-pa-parity \
          bash test/regression/meth_alt_pa_parity.sh

      - name: --meth output container follows --bam
        if: matrix.canonical == true
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          METH_SAM_PHIX_FA="$GITHUB_WORKSPACE/test/fixtures/phix.fa" \
          METH_SAM_WORK_DIR=/tmp/meth-sam-output \
          bash test/regression/meth_sam_output.sh

      - name: SE alignment smoke (chr22)
        if: matrix.canonical == true
        run: |
          "$GITHUB_WORKSPACE/bwa-mem3" mem -t 4 /tmp/chr22/chr22.fa \
            /tmp/chr22-sim/reads.r1.fastq.gz > /tmp/chr22-sim/se.sam 2>/dev/null
          records=$(grep -cv '^@' /tmp/chr22-sim/se.sam)
          [ "$records" -gt 0 ] || { echo "FAIL: SE alignment produced zero records"; exit 1; }
          grep -q '^@PG.*bwa-mem3' /tmp/chr22-sim/se.sam || { echo "FAIL: SE missing @PG"; exit 1; }
          echo "PASS: SE smoke ($records records)"

      - name: Interleaved alignment smoke (chr22)
        if: matrix.canonical == true
        run: |
          # Interleave R1 and R2 into a single FASTQ at FASTQ-record (4-line)
          # granularity. The naive `paste R1 R2 | tr '\t' '\n'` interleaves at
          # line granularity, which produces a malformed FASTQ. Collapse each
          # input to one tab-separated row per record first (`paste - - - -`),
          # then interleave whole records, then re-expand tabs to newlines.
          paste -d '\n' \
            <(zcat /tmp/chr22-sim/reads.r1.fastq.gz | paste - - - -) \
            <(zcat /tmp/chr22-sim/reads.r2.fastq.gz | paste - - - -) \
            | tr '\t' '\n' > /tmp/chr22-sim/interleaved.fq
          "$GITHUB_WORKSPACE/bwa-mem3" mem -p -t 4 /tmp/chr22/chr22.fa \
            /tmp/chr22-sim/interleaved.fq > /tmp/chr22-sim/p.sam 2>/dev/null
          records=$(grep -cv '^@' /tmp/chr22-sim/p.sam)
          [ "$records" -gt 0 ] || { echo "FAIL: interleaved alignment produced zero records"; exit 1; }
          # ~50,000 simulated PE pairs × 2 reads = ~100,000 input reads, so a
          # properly interleaved input must produce at least one SAM line per
          # read (primary alignment, mapped or unmapped). Tolerate >= because
          # secondary/supplementary alignments add extra lines. Without this
          # floor the previous `paste | tr` (line-interleaved, malformed FASTQ)
          # silently passed at ~50k records — half the reads, parser-tolerated.
          [ "$records" -ge 100000 ] || { echo "FAIL: expected >=100000 records, got $records"; exit 1; }
          echo "PASS: interleaved smoke ($records records)"

      - name: Install bwa-meth pixi env
        if: matrix.canonical == true
        # The holodeck setup-pixi step already installed the pixi binary
        # to /home/runner/.pixi/bin and added it to PATH. Calling
        # setup-pixi a second time would collide on the binary download
        # ("Destination file path /home/runner/.pixi/bin/pixi already
        # exists"). Resolve the bwa-meth project's deps directly using
        # the already-installed pixi instead.
        run: |
          pixi install --manifest-path test/meth/pyproject.toml

      - name: Checkout bwa-meth oracle
        if: matrix.canonical == true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Most important of the four: this is a THIRD-PARTY tree, and the
          # steps below copy fixtures out of it and run test/regression scripts
          # against it. Persisting this repository's token inside a foreign
          # checkout's .git/config has no use here at all.
          persist-credentials: false
          repository: brentp/bwa-meth
          path: bwa-meth-oracle

      - name: Copy bwa-meth fixtures into test/meth/
        if: matrix.canonical == true
        run: |
          cp bwa-meth-oracle/example/ref.fa test/meth/
          cp bwa-meth-oracle/example/t_R1.fastq.gz test/meth/
          cp bwa-meth-oracle/example/t_R2.fastq.gz test/meth/
          ls -la test/meth/

      # No BWAMETH_DIR: the checkout above is a fixture source, not an oracle
      # binary, and the copy step is what makes it reachable. Nothing under
      # test/meth/ has read that variable since Layers 2-3 were retired.
      #
      # "Layer 1", not "Layers 1-3", for the same reason: the harness retired
      # Layers 2-3 in D3, so a step named for them would advertise coverage no
      # longer being run. Renamed alongside the row in test/regression/README.md
      # that quotes this step name.
      - name: Run --meth Layer 1
        if: matrix.canonical == true
        run: bash test/regression/meth_oracle.sh

      - name: --meth whole-aligner regressions (D3)
        if: matrix.canonical == true
        # Self-contained --meth regressions (each generates its fixtures inline):
        # dual index + seed->original remap; mixed OT/OB PE per-hypothesis scoring;
        # OT/OB x strand placement; original-alphabet output integrity (Bismark
        # four-strand XR/XG); and the reverse-strand-conversion matrix flip
        # (meth_strand_hyp) — a reverse read that is unmapped under the unflipped
        # matrix and full-length under the fix; the batched OT/OB-partition mate
        # rescue being byte-identical to the scalar rescue; the `collapsed`
        # --meth-scoring model; --meth-tags spec resolution (all|none|list|
        # ^exclusion) plus its guarantee that tag selection leaves the alignment
        # untouched; the --meth-family flag footguns (a value orphaned by
        # `--meth taps` / `--meth-tags XR XG` / `--meth-seed-prune baseline` is
        # diagnosed by name instead of being aligned to as the reference, a
        # reference genuinely named after one of those values still works, and
        # `-XM` == `^XM`); and the --meth-seed-prune seed prune (the num_smem==1
        # must-fix maps; default==spec30; off/spec30 placement-invariant;
        # -t1==-t4 determinism; flag/env equivalence; malformed-value handling;
        # and stats-verified that the prune removes seeds, regime-A keeps all,
        # and baseline differs from spec30).
        env:
          BWA_MEM3: ${{ github.workspace }}/bwa-mem3
        run: |
          # All but meth_seed_index `exit 0` with "SKIP: samtools not on PATH"
          # when samtools is missing, so without this assertion a runner that
          # lost the apt package would turn the whole step into a green no-op.
          command -v samtools >/dev/null 2>&1 \
            || { echo "FAIL: samtools not on PATH; the --meth regressions would all SKIP"; exit 1; }
          for t in meth_seed_index meth_mixed_pe_asym meth_pe_placement \
                   meth_output_integrity meth_reverse_strand_conversion \
                   meth_seed_unpacked_ref_not_loaded \
                   meth_rescue_batched_identical meth_collapsed_scoring \
                   meth_tags meth_flag_footguns meth_seed_prune; do
            echo "::group::$t"; bash "test/regression/$t.sh"; echo "::endgroup::"
          done

      - name: Opt-in debug/instrumentation macro build (chr22 parity)
        if: matrix.canonical == true
        # The expensive debug checks and instrumentation in this tree sit behind
        # opt-in macros rather than `#ifndef NDEBUG`, because nothing here
        # defines NDEBUG (see test/regression/ndebug_gate_lint.sh). That is
        # correct, but it means no CI row compiles them, so they can rot
        # unnoticed until the dead code is deleted -- or, worse, until someone
        # enables one to debug a live problem and finds it no longer builds.
        #
        # One rebuild with every such macro on at once, then the same chr22
        # parity check the row already runs against the normal binary. This
        # asserts two things: the guarded code still compiles, and every check
        # it enables holds on real data. Five of the six are pure assertions or
        # scratch poisoning and the sixth (BWAMEM3_UGP_PROFILE) is profiling
        # counters that never feed the alignment result, so output must be
        # unchanged -- a failure here is a genuine invariant violation, not a
        # debug-build artifact.
        #
        # BWA_MEM3_DEBUG_CHN_FLT_XCHECK, BWA_MEM3_DEBUG_RID_CHECK and
        # BWA_MEM3_DEBUG_UNGAPPED_XCHECK are defined ahead of the changes that
        # introduce them; until those land the flags are simply unused, which
        # costs nothing and avoids a follow-up CI edit.
        #
        # Placed immediately before the ASAN step because both replace
        # $GITHUB_WORKSPACE/bwa-mem3 with a differently-configured binary; the
        # ASAN step does its own `make clean` and so is unaffected by this one.
        run: |
          make clean
          make -j"$(nproc)" arch=${{ matrix.arch_flag }} \
            CXX=${{ matrix.cxx || 'clang++-19' }} \
            USE_MIMALLOC=${{ matrix.use_mimalloc }} \
            EXTRA_CXXFLAGS="-DBWA_MEM3_DEBUG_CHN_FLT_XCHECK -DBWA_MEM3_DEBUG_RID_CHECK -DBWA_MEM3_DEBUG_UNGAPPED_XCHECK -DBSW8_ASSERT_ENVELOPE -DBWA_MEM3_DEBUG_POISON -DBWAMEM3_UGP_PROFILE=1 -DBWA_MEM3_DEBUG_RESCUE_STATS"
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          BWA_CHR22_FA=/tmp/chr22/bwa_chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim \
          bash test/regression/chr22_parity.sh

      - name: SIMD floor enforcement (TESTING_BUILD, injected below-floor tier)
        if: matrix.canonical == true
        # What happens when the binary lands on a host older than the floor it
        # was built for is a user-facing promise: refuse with exit 2 and a
        # readable [E::bwamem3] message, not a SIGILL. host_floor_enforce.sh
        # asserts exactly that, using the BWAMEM3_TESTING_HOST_TIER hook to
        # inject a below-floor tier, and it had never run in CI -- it hangs off
        # `test-injection`, a target no workflow invoked.
        #
        # Invoked through the target rather than by calling the script, so the
        # env contract (injected tier, PARITY_FA) lives in one place and the
        # target itself stays exercised. The row is avx2, so sse41 is below
        # floor. The reference is never opened -- the precheck fires first --
        # so /dev/null is a real fixture here, not a shortcut.
        #
        # Placed here for the same reason as the step above: it replaces
        # $GITHUB_WORKSPACE/bwa-mem3 with a differently-configured binary, and
        # the ASAN step that follows does its own `make clean`. The flags are
        # repeated on the second `make` so it sees the same configuration and
        # treats the build as up to date instead of rebuilding.
        #
        # USE_MIMALLOC is carried from the row rather than left to the Makefile
        # default, which is what every other build step here does. TESTING_BUILD
        # is meant to vary one thing against the row's configuration; the
        # canonical row happens to be USE_MIMALLOC=1 and so is the default, so
        # omitting it is a no-op only until that row changes.
        run: |
          make clean
          make -j"$(nproc)" arch=${{ matrix.arch_flag }} \
            CXX=${{ matrix.cxx || 'clang++-19' }} \
            USE_MIMALLOC=${{ matrix.use_mimalloc }} TESTING_BUILD=1
          make test-injection arch=${{ matrix.arch_flag }} \
            CXX=${{ matrix.cxx || 'clang++-19' }} \
            USE_MIMALLOC=${{ matrix.use_mimalloc }} TESTING_BUILD=1

      - name: Short-read SE smoke (chr22, ASAN, dense+variable-length)
        if: matrix.canonical == true
        # Guards the wsize_mem byte-vs-entry capacity-tracker class of bug
        # fixed in PR #100. The fixture simulates 25-50 bp variable-length
        # reads from chr22:14M-20M (pericentromeric, repeat-rich) at 5-10%
        # error so SMEM density per base exceeds tot_len bytes across
        # successive batches with mismatched byte totals — exactly the
        # regime that inverts the `if (tot_len >= wsize_mem)` gate.
        # Builds with ASAN=1 (forces USE_MIMALLOC=0; mimalloc and asan
        # can't coexist) so the heap-buffer-overflow in mem_collect_smem
        # surfaces as a non-zero exit independent of allocator behavior.
        # Placed last in the canonical row because `make clean && make
        # ASAN=1` replaces $GITHUB_WORKSPACE/bwa-mem3; nothing after this
        # step uses the binary. Canonical-only because PR #100 confirmed
        # the bug is input-regime-specific, not codegen-/SIMD-specific
        # (reproduces on AVX2, AVX-512BW, SMEM_LOCKSTEP_N=1).
        run: |
          make clean
          make -j"$(nproc)" arch=${{ matrix.arch_flag }} \
            CXX=${{ matrix.cxx || 'clang++-19' }} ASAN=1
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          CHR22_FA=/tmp/chr22/chr22.fa \
          CHR22_SIM_DIR=/tmp/chr22-sim-dense \
          PIXI_MANIFEST="$GITHUB_WORKSPACE/test/holodeck/pixi.toml" \
          bash test/regression/short_read_smoke.sh
          # Re-run the header regression against the SAME asan binary. The
          # header writers size buffers from header text, and a one-byte
          # overrun there changes no output byte, so the non-asan run of this
          # script earlier in the row cannot see it -- only asan can. Cheap
          # (it builds its own 3-contig ALT fixture) and it needs the samtools
          # apt package this row already installs for `samtools dict`.
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          HEADER_PARITY_WORK_DIR=/tmp/header-parity-asan \
          bash test/regression/header_parity.sh

  coverage:
    name: Coverage (Linux AVX2, gcov → Codecov)
    runs-on: ubuntu-latest
    # Build + tests under coverage instrumentation, ~a few minutes normally.
    timeout-minutes: 30
    # Coverage uses gcov/gcovr, which are GCC tools, so this lane must build with
    # g++ — below the compiler floor by necessity, so it opts out.
    env:
      # Select the below-floor compiler explicitly at job scope so every direct
      # and nested `make` uses it, rather than relying on the runner default.
      CXX: g++
      CC: gcc
      ALLOW_UNSUPPORTED_COMPILER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev autoconf automake gcovr
          version: 1.0

      - name: Build libbwa.a with coverage
        run: make -j"$(nproc)" arch=avx2 CXX=g++ USE_MIMALLOC=0 COVERAGE=1

      - name: Build test binaries with coverage
        # Go through the parent test-binaries target so ARCH_FLAGS_FROM_PARENT
        # propagates and the test TU sees the same __AVX2__ / __AVX512BW__
        # surface libbwa.a was compiled with. COVERAGE=1 still flows in via
        # MAKEFLAGS.
        run: make test-binaries arch=avx2 CXX=g++ COVERAGE=1

      - name: Run unit tests
        run: ./test/bwa_mem3_tests_unit

      - name: Run integration tests
        run: ./test/bwa_mem3_tests_integration

      - name: Collect coverage into Cobertura XML
        # gcovr walks the tree, runs gcov on each .gcda, and emits a
        # single Cobertura XML that Codecov can consume directly. Limit
        # to src/ and test/ (skip vendored htslib / mimalloc / etc.).
        # `--filter` patterns are regular expressions matched against
        # paths relative to `--root` and are NOT implicitly anchored, so
        # prefix each with `^` to scope them to the project root and
        # cleanly exclude anything under ext/ that happens to share a
        # subpath (e.g. ext/htslib/test/).
        run: |
          gcovr --root . \
                --filter '^src/' --filter '^test/framework/' \
                --filter '^test/unit/' --filter '^test/integration/' \
                --print-summary \
                --xml coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  # MemorySanitizer gate for the batched banded-SW kernels' padded-lane
  # initialization. The kernels round each batch up to a whole SIMD width and
  # process the trailing padding lanes, reading their input fields back
  # (idr/idq -> seq pointers; h0 -> the banded DP seed and the cross-lane
  # all-lanes-done reduction). A tier that leaves one of those fields
  # uninitialized reads indeterminate memory -- benign in output (proven
  # byte-identical) but real UB. The in-tree tests build the batch with a
  # std::vector, which value-initializes the padding to 0, so they cannot see
  # it; this gate hands the kernels a raw-malloc'd (genuinely uninitialized)
  # pair array and runs under MSan, which reports any padded-lane read the
  # kernel did not first write. It is the automated form of the manual review
  # that caught this class -- see test/kernel_padded_lane_uninit_test.cpp.
  #
  # continue-on-error until the padded-lane fixes land: on a tree that still
  # has an uninitialized padded field this gate FAILS (exit 77) -- that is the
  # gate working, not a flake. This lane is added alongside the fixes, so on the
  # current base it is expected red; the soft-fail keeps it from blocking while
  # it and the fixes merge, then it flips to a hard gate. FLIP TO A HARD GATE
  # (delete `continue-on-error`) ONCE THE PADDED-LANE INITIALIZATION FIXES ARE
  # IN main.
  msan-padded-lane-gate:
    name: MSan padded-lane gate (banded-SW)
    runs-on: ubuntu-latest
    # One instrumented build of the kernel + a single fast run. Ceiling catches
    # a hung runner only.
    timeout-minutes: 20
    continue-on-error: true
    # MSan is a clang-only instrumentation; clang-19 is the shipping/floor
    # compiler, installed from apt.llvm.org below (same as the matrix), so no
    # ALLOW_UNSUPPORTED_COMPILER opt-out is needed here.
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies (Linux)
        # Same set the matrix rows install: zlib/libdeflate for htslib's static
        # link path, autoconf/automake for its configure, libomp for the
        # libsais -fopenmp compile pulled in when building libbwa.a. libomp-19-dev
        # (matching clang-19) is added by the clang-19 install step below.
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev autoconf automake libomp-dev
          version: 1.1

      - name: Install clang-19 (Linux)
        # Identical verified-key install to the build-and-test matrix: fetch
        # LLVM's archive signing key, verify its fingerprint against LLVM's
        # published value, store it in a dedicated keyring, and add the repo
        # signed-by that keyring so a tampered mirror can't run code as root or
        # slip in unsigned packages.
        run: |
          set -euo pipefail
          . /etc/os-release
          codename="${VERSION_CODENAME:-$(lsb_release -cs)}"
          expected_fpr="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          got_fpr="$(gpg --show-keys --with-colons --with-fingerprint /tmp/llvm-snapshot.gpg.key \
            | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ "$got_fpr" != "$expected_fpr" ]; then
            echo "FATAL: LLVM archive key fingerprint mismatch: got '$got_fpr', expected '$expected_fpr'" >&2
            exit 1
          fi
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo gpg --dearmor -o /etc/apt/keyrings/llvm-snapshot.gpg /tmp/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 libomp-19-dev
          clang++-19 --version | head -1

      - name: Build the padded-lane gate under MemorySanitizer
        # MSAN=1 forces USE_MIMALLOC off (mimalloc's malloc override interposes
        # ahead of the sanitizer runtime) and compiles with -fsanitize=memory
        # -fsanitize-memory-track-origins=2. Built at -march=native against the
        # native-tier kernel object, so this runner's widest getScores8/16
        # wrappers are the ones exercised (avx2/avx512bw on this x86 lane).
        run: |
          make -j"$(nproc)" MSAN=1 CXX=clang++-19 CC=clang-19 \
            kernel_padded_lane_uninit_test

      - name: Run the padded-lane gate
        # exitcode=77 so an uninitialized padded-lane read is a distinct,
        # unmistakable failure code (not the 1 a build/link error would give);
        # halt_on_error=1 stops at the first report. Exit 0 == every padded-lane
        # field the kernel reads was written first.
        run: |
          MSAN_OPTIONS=exitcode=77:halt_on_error=1 \
            ./kernel_padded_lane_uninit_test

  # Profiling (--profile) is compiled out of the default build, so the matrix
  # rows above never exercise the STAGE_PROF=1 code path. Build it here (and run
  # the stage_prof unit test) so the opt-in path cannot silently bit-rot.
  profiling-build:
    name: Profiling build (STAGE_PROF=1)
    runs-on: ubuntu-latest
    # Single instrumented build plus a small unit test and one regression.
    timeout-minutes: 20
    # A specialized instrumentation lane exercising the STAGE_PROF=1 code path;
    # builds with the runner's g++ (below the floor) and opts out. Migrating it
    # to clang-19 is a possible follow-up.
    env:
      # Select the below-floor compiler explicitly at job scope so every direct
      # and nested `make` uses it, rather than relying on the runner default.
      CXX: g++
      CC: gcc
      ALLOW_UNSUPPORTED_COMPILER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies (Linux)
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: zlib1g-dev libdeflate-dev autoconf automake libomp-dev
          version: 1.1

      - name: Build with profiling compiled in
        run: make -j"$(nproc)" STAGE_PROF=1 BASELINE_ARCH=avx2 CXX=g++ USE_MIMALLOC=1

      - name: --profile is exposed in this build
        run: |
          ./bwa-mem3 mem 2>&1 | grep -q -- '--profile' \
            || { echo "::error::--profile missing from a STAGE_PROF=1 build"; exit 1; }

      - name: stage_prof unit test
        run: make stage_prof_test && ./stage_prof_test

      - name: Partial cohort slices report their compute CPU
        # Only a STAGE_PROF build can run this, which is why it lives here and
        # not in the matrix rows above. Cohort slicing gives step 1 an early
        # exit; if that exit forgets to harvest g_ktfor, the slice's compute CPU
        # is destroyed rather than merely unreported, and --profile under-counts
        # in proportion to how much slicing is happening.
        run: |
          BWA_MEM3="$GITHUB_WORKSPACE/bwa-mem3" \
          FIXTURES="$GITHUB_WORKSPACE/test/fixtures" \
          bash test/regression/profile_slice_cpu.sh
